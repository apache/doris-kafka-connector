github:
  description: Kafka Connector for Apache Doris
  homepage: https://doris.apache.org
  labels:
    - olap
    - mpp
    - apache
    - doris
    - kafka
    - kafka-connect
    - etl
    - data-streaming

  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false

  rulesets:
    - name: Default and release branch protection
      type: branch
      branches:
        includes:
          - '~DEFAULT_BRANCH'
          - 'release-*'
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 1

    - name: Master branch required checks
      type: branch
      branches:
        includes:
          - master
      restrict_deletion: false
      restrict_force_push: false
      required_status_checks_strict: false
      required_status_checks:
        - name: Build Doris Kafka Connector
          app_slug: 15368
        - name: CheckStyle
          app_slug: 15368
        - name: License Check
          app_slug: 15368
        - name: e2e test case
          app_slug: 15368

  features:
    issues: true
    projects: true

notifications:
    issues: commits@doris.apache.org
    commits: commits@doris.apache.org
    pullrequests_status:  commits@doris.apache.org

