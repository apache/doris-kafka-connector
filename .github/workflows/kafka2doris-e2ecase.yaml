---
name: E2E Test CI
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-extension:
    name: "e2e test case"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure Doris prerequisites
        run: |
          sudo sysctl -w vm.max_map_count=2000000
          sudo swapoff -a

      - name: Doris E2E Test
        run: |
          mvn test -Dtest='org.apache.doris.kafka.connector.e2e.**'
